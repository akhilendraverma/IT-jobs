name: Update IT jobs

on:
  schedule:
    - cron: "17 5 * * *"   # every day at about 05:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect jobs
        run: python build.py
      - name: Publish
        run: |
          git config user.name "IT Jobs bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/jobs.json sources.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +'%Y-%m-%d')"
          git push
